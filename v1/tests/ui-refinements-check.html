      const luminance = color => {
        const channels = (color.match(/[\d.]+/g) || []).slice(0, 3).map(value => Number(value) / 255).map(value => value <= .04045 ? value / 12.92 : ((value + .055) / 1.055) ** 2.4);
        return .2126 * channels[0] + .7152 * channels[1] + .0722 * channels[2];
      };
      const values = [luminance(foreground), luminance(background)].sort((a, b) => b - a);
      return (values[0] + .05) / (values[1] + .05);

        const detailIndicator = doc.querySelector('.summary-percent strong');
        const detailIndicatorRail = getComputedStyle(detailIndicator, '::after');
        if (!detailIndicatorRail.backgroundImage.includes('linear-gradient') || Number.parseFloat(detailIndicatorRail.height) < 4) throw new Error('detail serviceability percentage did not use the premium indicator treatment');
        for (const card of doc.querySelectorAll('.summary-stat')) {
          const percentageNode = card.querySelector('b');
          const percentageStyle = getComputedStyle(percentageNode);
          const percentagePill = getComputedStyle(percentageNode, '::before');
          if (contrastRatio(percentageStyle.color, percentagePill.backgroundColor) < 4.5) throw new Error('Light Mode status-card percentage contrast was below 4.5:1');
          if (Number(percentageStyle.fontWeight) < 600 || percentagePill.backgroundColor === 'rgba(0, 0, 0, 0)' || Number.parseFloat(percentagePill.borderRadius) < 20) throw new Error('Light Mode status percentage did not use the premium pill treatment');
        }
        if (getComputedStyle(doc.querySelector('.available-stat b')).color === getComputedStyle(doc.querySelector('.unavailable-stat b')).color) throw new Error('Serviceable and unserviceable percentage indicators were not visually distinct');
        const statusCardStyles = [...doc.querySelectorAll('.summary-stat')].map(card => getComputedStyle(card));
        if (statusCardStyles.some(style => style.backgroundImage.includes('linear-gradient') || style.boxShadow === 'none') || new Set(statusCardStyles.map(style => style.backgroundColor)).size !== 3) throw new Error('non-Serviceability summary cards did not use distinct solid professional surfaces');
        if (api.percentageStyle(0) !== '--percentage:0%' || api.percentageStyle(100) !== '--percentage:100%') throw new Error('0% and 100% gradient endpoints were not supported');
        if (![...doc.querySelectorAll('tbody tr td:nth-last-child(2)')].every(cell => cell.textContent.trim().startsWith('21-Oct-2026'))) throw new Error('table dates did not use selected dd-MMM-yyyy date');
        if ([...doc.querySelectorAll('th')].some(cell => cell.textContent.trim() === 'Actions')) throw new Error('Actions column remained');
        if (doc.querySelectorAll('tbody tr').length !== 10) throw new Error('selected-unit first page did not contain ten records');
        if (doc.querySelector('.page-status')?.textContent.trim() !== 'Page 1 of 2' || !doc.querySelector('[data-page-action="previous"]')?.disabled || doc.querySelector('[data-page-action="next"]')?.disabled) throw new Error('initial pagination controls were incorrect');
        const firstPageIds = [...doc.querySelectorAll('tbody tr')].map(row => row.dataset.recordId);
        doc.querySelector('[data-page-action="next"]').focus();
        doc.querySelector('[data-page-action="next"]').click();
        await delay(75);
        const secondPageRows = [...doc.querySelectorAll('tbody tr')];
        if (doc.querySelector('.page-status').textContent.trim() !== 'Page 2 of 2' || secondPageRows.length !== 1 || firstPageIds.includes(secondPageRows[0].dataset.recordId) || secondPageRows[0].firstElementChild.textContent.trim() !== '11') throw new Error('Next pagination produced duplicate, missing or misnumbered rows');
        if (doc.activeElement?.dataset.pageAction !== 'previous') throw new Error('pagination did not preserve keyboard focus after repaint');
        secondPageRows[0].dispatchEvent(new MouseEvent('dblclick', {bubbles: true}));
        await delay(50);
        if (!doc.querySelector('dialog[open]')) throw new Error('later-page row did not retain double-click behavior');
        doc.querySelector('dialog[open] [data-action="close"]').click();
        await delay(50);
        doc.querySelector('[data-summary-filter="serviceability"]').focus();
        doc.querySelector('[data-summary-filter="serviceability"]').dispatchEvent(new KeyboardEvent('keydown', {key: ' ', bubbles: true}));
        await delay(75);
        if (doc.querySelector('.page-status').textContent.trim() !== 'Page 1 of 1' || doc.querySelectorAll('tbody tr').length !== 6 || [...doc.querySelectorAll('tbody .status-badge')].some(node => !node.classList.contains('available')) || doc.querySelectorAll('.summary-filter.active').length !== 1 || !doc.querySelector('[data-summary-filter="serviceability"]').classList.contains('active')) throw new Error('Serviceability card filter or active indication was incorrect');
        if (doc.activeElement?.dataset.summaryFilter !== 'serviceability') throw new Error('summary filtering did not preserve keyboard focus after repaint');
        doc.querySelector('[data-summary-filter="mission"]').click();
        await delay(75);
        if (doc.querySelectorAll('tbody tr').length !== 4 || [...doc.querySelectorAll('tbody .status-badge')].some(node => !node.classList.contains('mission'))) throw new Error('On Mission card did not filter the current Unit/date');
        doc.querySelector('[data-summary-filter="unavailable"]').click();
        await delay(75);
        if (doc.querySelectorAll('tbody tr').length !== 1 || !doc.querySelector('tbody .status-badge.unavailable')) throw new Error('Not Available card did not filter the current Unit/date');
        doc.querySelector('[data-summary-filter="available"]').click();
        await delay(75);
        if (doc.querySelectorAll('tbody tr').length !== 6 || !doc.querySelector('[data-summary-filter="available"]').classList.contains('active')) throw new Error('Available card did not filter or become active');
        let resetState = {screen: 'suv', theme: 'light', unit: 'Unit C', date: '2026-10-21', activeRecordId: null, statusFilter: 'mission', page: 2};
        resetState = api.transition(resetState, {type: 'set-date', date: '2026-10-20'});
        if (resetState.page !== 1 || resetState.statusFilter !== 'mission') throw new Error('date change did not reset pagination while retaining the selected filter');
        frame.contentWindow.location.hash = 'dashboard';
        await delay(75);
        frame.contentWindow.location.hash = 'suv';
        await delay(75);
        if (doc.querySelector('.page-status').textContent.trim() !== 'Page 1 of 2' || doc.querySelectorAll('.summary-filter.active').length) throw new Error('detail navigation did not reset filter and pagination');
        const selectedRow = doc.querySelector('tbody tr');
        const selectedRecordId = selectedRow.dataset.recordId;
        const beforeDialog = JSON.stringify(api.recordsFor('All', 'all', '2026-10-21'));
        const storageBeforeDialog = frame.contentWindow.localStorage.getItem(api.STORAGE_KEY);
        const referenceStatus = api.recordsByDate['2026-10-22'].find(record => record.id === selectedRecordId).status;
        selectedRow.dispatchEvent(new MouseEvent('dblclick', {bubbles: true}));
        await delay(100);
        let dialog = doc.querySelector('dialog[open]');
        if (!dialog) throw new Error('row double-click did not open the dialog');
        const visibleActions = () => [...dialog.querySelectorAll('.dialog-actions button:not([hidden])')].map(button => button.textContent.trim());
        if (JSON.stringify(visibleActions()) !== JSON.stringify(['Modify', 'Close'])) throw new Error(`view mode buttons were ${JSON.stringify(visibleActions())}`);
        if ([...dialog.querySelectorAll('select, input, textarea')].some(control => !control.disabled)) throw new Error('view mode controls were editable');
        const labels = [...dialog.querySelectorAll('label')].map(label => label.childNodes[0].textContent.trim().replace(/:$/, ''));
        const expectedLabels = ['Status', 'Discovered Date', 'Location', 'Deployed', 'Reason for Non-Serviceability'];
        if (JSON.stringify(labels) !== JSON.stringify(expectedLabels)) throw new Error(`dialog fields were ${JSON.stringify(labels)}`);
        if (dialog.querySelector('textarea')?.rows !== 5) throw new Error('reason textarea did not have five rows');
        const optionSets = [...dialog.querySelectorAll('select')].map(select => [...select.options].map(option => option.value));
        if (JSON.stringify(optionSets) !== JSON.stringify([['Serviceable', 'Non-Serviceable'], ['Inside Country', 'Outside Country'], ['Yes', 'No']])) {
          throw new Error(`dialog options were ${JSON.stringify(optionSets)}`);
        }
        if (getComputedStyle(dialog).backgroundColor !== getComputedStyle(doc.querySelector('.table-panel')).backgroundColor) {
          throw new Error('Light Mode dialog did not match the detail surface');
        }
        if ([...dialog.querySelectorAll('label')].some(label => getComputedStyle(label).display !== 'grid')) {
          throw new Error('dialog labels and controls were not aligned');
        }
        if (dialog.querySelector('.formatted-date-input > span').textContent.trim() !== '21-Oct-2026') throw new Error('popup date did not use dd-MMM-yyyy');
        dialog.querySelector('[data-action="modify"]').click();
        await delay(50);
        if (JSON.stringify(visibleActions()) !== JSON.stringify(['Save', 'Cancel'])) throw new Error(`edit mode buttons were ${JSON.stringify(visibleActions())}`);
        if ([...dialog.querySelectorAll('select, input, textarea')].some(control => control.disabled)) throw new Error('edit mode controls were not enabled');
        dialog.querySelector('[name="status"]').value = 'Non-Serviceable';
        dialog.querySelector('[name="discoveredDate"]').value = '2026-10-20';
        dialog.querySelector('[name="location"]').value = 'Outside Country';
        dialog.querySelector('[name="deployed"]').value = 'No';
        dialog.querySelector('[name="reason"]').value = 'cancel this change';
        dialog.querySelector('[data-action="cancel"]').click();
        await delay(50);
        dialog = doc.querySelector('dialog[open]');
        if (!dialog || JSON.stringify(visibleActions()) !== JSON.stringify(['Modify', 'Close'])) throw new Error('Cancel did not keep the popup open in view mode');
        if (JSON.stringify(api.recordsFor('All', 'all', '2026-10-21')) !== beforeDialog || frame.contentWindow.localStorage.getItem(api.STORAGE_KEY) !== storageBeforeDialog) throw new Error('Cancel changed records or browser storage');
        if (dialog.querySelector('[name="reason"]').value === 'cancel this change') throw new Error('Cancel did not restore stored values');
        dialog.querySelector('[data-action="modify"]').click();
        dialog.querySelector('[name="status"]').value = 'Non-Serviceable';
        dialog.querySelector('[name="discoveredDate"]').value = '2026-10-20';
        dialog.querySelector('[name="location"]').value = 'Outside Country';
        dialog.querySelector('[name="deployed"]').value = 'No';
        dialog.querySelector('[name="reason"]').value = 'Brake inspection required';
        dialog.querySelector('[data-action="save"]').click();
        await delay(100);
        dialog = doc.querySelector('dialog[open]');
        if (!dialog || JSON.stringify(visibleActions()) !== JSON.stringify(['Modify', 'Close'])) throw new Error('Save did not keep the popup open in view mode');
        const savedRecord = api.recordsFor('All', 'all', '2026-10-21').find(record => record.id === selectedRecordId);
        if (JSON.stringify([savedRecord.status, savedRecord.discoveredDate, savedRecord.location, savedRecord.deployed, savedRecord.reason]) !== JSON.stringify(['Not Available', '2026-10-20', 'Outside Country', 'No', 'Brake inspection required'])) throw new Error('Save did not persist all popup fields');
        const savedEdit = api.getSavedRecord('2026-10-21', selectedRecordId);
        if (!savedEdit || savedEdit.status !== 'Non-Serviceable' || savedEdit.reason !== 'Brake inspection required') throw new Error('Save did not create the date/vehicle storage entry');
        const persisted = JSON.parse(frame.contentWindow.localStorage.getItem(api.STORAGE_KEY));
        if (!persisted.edits[`2026-10-21|${selectedRecordId}`] || persisted.edits[`2026-10-22|${selectedRecordId}`]) throw new Error('localStorage was not keyed by selected date and vehicle');
        api.reloadSavedRecords(frame.contentWindow.localStorage);
        if (api.recordsFor('All', 'all', '2026-10-21').find(record => record.id === selectedRecordId).reason !== 'Brake inspection required') throw new Error('saved popup values were not retrieved after storage rehydration');
        if (api.recordsFor('All', 'all', '2026-10-22').find(record => record.id === selectedRecordId).status !== referenceStatus || api.getSavedRecord('2026-10-22', selectedRecordId)) throw new Error('Save changed the reference-date result');
        if (JSON.stringify(api.recordsByDate) !== immutableSource) throw new Error('Save mutated an original date snapshot');
        if (doc.querySelector('.summary-percent').textContent.trim() !== '45%' || !doc.querySelector('.summary-main').textContent.includes('5 / 11')) throw new Error('Save did not recalculate detail aggregates');
        if (!doc.querySelector(`tr[data-record-id="${selectedRecordId}"] .status-badge.unavailable`)) throw new Error('Save did not update the displayed vehicle row');
        doc.getElementById('theme-toggle').click();
        await delay(100);
        dialog = doc.querySelector('dialog[open]');
        if (doc.documentElement.dataset.theme !== 'dark' || !dialog) throw new Error('dialog did not remain open in Dark Mode');
        if (!getComputedStyle(doc.querySelector('.summary-main')).backgroundImage.includes('linear-gradient') || [...doc.querySelectorAll('.summary-stat')].some(card => getComputedStyle(card).backgroundImage.includes('linear-gradient'))) throw new Error('Dark Mode did not keep the gradient exclusive to Serviceability');
        const darkStatusStyles = [...doc.querySelectorAll('.summary-stat')].map(card => getComputedStyle(card));
        if (darkStatusStyles.some(style => style.boxShadow === 'none') || new Set(darkStatusStyles.map(style => style.backgroundColor)).size !== 3) throw new Error('Dark Mode status cards did not keep distinct professional surfaces');
        for (const card of doc.querySelectorAll('.summary-stat')) {
          const percentageNode = card.querySelector('b');
          const percentageStyle = getComputedStyle(percentageNode);
          const percentagePill = getComputedStyle(percentageNode, '::before');
          if (contrastRatio(percentageStyle.color, percentagePill.backgroundColor) < 4.5 || percentagePill.backgroundColor === 'rgba(0, 0, 0, 0)') throw new Error('Dark Mode status percentage did not retain its premium readable treatment');
        }
        if (getComputedStyle(dialog).backgroundColor !== getComputedStyle(doc.querySelector('.table-panel')).backgroundColor) {
          throw new Error('Dark Mode dialog did not match the detail surface');
        }
        doc.getElementById('theme-toggle').click();
        await delay(100);
        dialog = doc.querySelector('dialog[open]');
        dialog.querySelector('[data-action="close"]').click();
        await delay(100);
        if (doc.querySelector('dialog[open]')) throw new Error('Close did not close the popup');
        const missionRow = doc.querySelector('.status-badge.mission').closest('tr');
        const missionRecordId = missionRow.dataset.recordId;
        missionRow.dispatchEvent(new MouseEvent('dblclick', {bubbles: true}));
        await delay(50);
        dialog = doc.querySelector('dialog[open]');
        if (!dialog) throw new Error('On Mission row did not reopen the popup');
        dialog.querySelector('[data-action="modify"]').click();
        dialog.querySelector('[data-action="save"]').click();
        await delay(100);
        if (api.recordsFor('All', 'all', '2026-10-21').find(record => record.id === missionRecordId).status !== 'On Mission') throw new Error('saving an unchanged On Mission record changed its operational status');
        const closeUnchanged = doc.querySelector('dialog[open] [data-action="close"]');
        if (!closeUnchanged) throw new Error('unchanged Save did not keep the popup open in view mode');
        closeUnchanged.click();
        await delay(50);
        frame.contentWindow.location.hash = 'dashboard';
        await delay(100);
        doc.getElementById('dashboard-date').value = '2026-10-22';
        doc.getElementById('dashboard-date').dispatchEvent(new Event('change', {bubbles: true}));
        await delay(100);
        const resetUnit = doc.getElementById('unit-filter');
        resetUnit.value = 'All';
        resetUnit.dispatchEvent(new Event('change', {bubbles: true}));
        await delay(100);
        if (doc.querySelector('.category-all .service-percent').textContent.trim() !== '70%' || !doc.querySelector('.category-all').textContent.includes('84 / 120')) {
          throw new Error('All did not restore original dashboard values');
        }
        const retainedDate = doc.getElementById('dashboard-date').value;
        doc.getElementById('dashboard-date').value = '';
        doc.getElementById('dashboard-date').dispatchEvent(new Event('change', {bubbles: true}));
        await delay(100);
        if (doc.getElementById('dashboard-date').value !== retainedDate) throw new Error('clearing the date did not retain the previous selection');
        const gridRect = doc.querySelector('.category-grid').getBoundingClientRect();
        const overviewRect = doc.querySelector('.overview').getBoundingClientRect();
        if (overviewRect.top - gridRect.bottom < 24) throw new Error(`Fleet Overview gap was ${overviewRect.top - gridRect.bottom}px`);
        const overviewGraphic = doc.querySelector('.overview-heading > .icon');
        const overviewGraphicRect = overviewGraphic.getBoundingClientRect();
        const overviewTextRect = doc.querySelector('.overview-heading > div').getBoundingClientRect();
        if (overviewGraphic.scrollWidth > overviewGraphic.clientWidth || overviewGraphicRect.right + 12 > overviewTextRect.left) throw new Error('Fleet Overview graphic overlapped its text');
        for (const image of doc.querySelectorAll('.category-card .vehicle-art img')) {
          const imageRect = image.getBoundingClientRect();
          const artRect = image.closest('.vehicle-art').getBoundingClientRect();
          if (imageRect.left < artRect.left - .5 || imageRect.right > artRect.right + .5 || imageRect.top < artRect.top - .5 || imageRect.bottom > artRect.bottom + .5) {
            throw new Error(`vehicle image escaped its art area: ${image.className}`);
          }
          if (getComputedStyle(image).objectFit !== 'contain') throw new Error('vehicle image was not fitted with contain');
        }
        for (const screen of Object.keys(expectedPercentages)) {
          frame.contentWindow.location.hash = 'dashboard';
          await delay(100);
          const card = doc.querySelector(`.category-${screen}`);
          card.click();
          await delay(100);
          if (frame.contentWindow.location.hash !== '#dashboard') throw new Error(`${screen} card background navigated`);
          for (const selector of ['h2', '.service-percent', '.vehicle-art']) {
            card.querySelector(selector).click();
            await delay(100);
            if (frame.contentWindow.location.hash !== '#dashboard') throw new Error(`${screen} ${selector} navigated`);
          }
          card.querySelector('.round-arrow').click();
          await delay(100);
          if (frame.contentWindow.location.hash !== `#${screen}` || doc.querySelector('h1').textContent !== expectedTitles[screen]) {
            throw new Error(`${screen} arrow did not open its detail page`);
          }
          if (!doc.getElementById('detail-unit').disabled || doc.getElementById('detail-unit').value !== 'All') throw new Error('disabled detail Unit did not match the dashboard Unit');
        }
        for (const [screen, percentage] of Object.entries(expectedPercentages)) {
          frame.contentWindow.location.hash = screen;
          await delay(100);
          const rendered = doc.querySelector('.summary-percent').textContent.trim();
          if (rendered !== percentage) throw new Error(`${screen} detail percentage was ${JSON.stringify(rendered)}`);
          if (screen === 'suv' && doc.querySelector('.available-stat b').textContent.trim() !== '62%') throw new Error('All/SUV Available percentage did not retain 62%');
        }
        frame.contentWindow.location.hash = 'all';
        await delay(100);
        const referenceRow = doc.querySelector('tbody tr');
        const referenceId = referenceRow.dataset.recordId;
        referenceRow.dispatchEvent(new MouseEvent('dblclick', {bubbles: true}));
        await delay(50);
        dialog = doc.querySelector('dialog[open]');
        dialog.querySelector('[data-action="modify"]').click();
        dialog.querySelector('[name="status"]').value = 'Non-Serviceable';
        dialog.querySelector('[name="reason"]').value = '<b id="review-marker">Brake check</b>';
        dialog.querySelector('[data-action="save"]').click();
        await delay(100);
        if (doc.querySelector('.summary-percent').textContent.trim() !== '69%' || doc.querySelector('.available-stat b').textContent.trim() !== '69%' || getComputedStyle(doc.querySelector('.summary-main')).getPropertyValue('--percentage').trim() !== '69%') throw new Error('reference-date Save left the Available percentage or Serviceability gradient frozen');
        const updatedReferenceRow = doc.querySelector(`tr[data-record-id="${referenceId}"]`);
        if (updatedReferenceRow.querySelector('#review-marker') || updatedReferenceRow.lastElementChild.textContent.trim() !== '<b id="review-marker">Brake check</b>') throw new Error('saved Reason was not rendered as plain text');
        const noOpUnavailable = api.vehicleRecords.find(record => record.status === 'Not Available' && record.reason === '' && record.assignment !== 'Under Maintenance');
        if (!noOpUnavailable) throw new Error('no reference Not Available record was available for no-op Save verification');
        const preservedAssignment = noOpUnavailable.assignment;
        const noOpResult = api.saveRecord('2026-10-22', noOpUnavailable.id, {status: 'Non-Serviceable', discoveredDate: noOpUnavailable.discoveredDate, location: 'Outside Country', deployed: 'No', reason: ''});
        if (noOpResult.assignment !== preservedAssignment || noOpResult.location !== 'Outside Country' || noOpResult.deployed !== 'No' || noOpUnavailable.location !== 'Inside Country') throw new Error('unchanged status/reason Save did not preserve assignment and source immutability');
        report('PASS', 'premium card surfaces and percentage indicators; disabled detail Unit; React integration contract; reconciled records; filters, pagination and persisted edits');
      } catch (error) {
        report('FAIL', error.message);
      } finally {
        if (originalStoredEdits === null) localStorage.removeItem(storageKey);
        else localStorage.setItem(storageKey, originalStoredEdits);
      }
    });
    document.getElementById('prototype').src = '../prototype/index.html';
  </script>
</body>
