<!doctype html>
<meta charset="utf-8">
<title>UI refinement browser check</title>
<body data-result="running">
  <pre id="result">RUNNING</pre>
  <iframe id="prototype" src="../prototype/index.html" hidden></iframe>
  <script>
    const delay = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));
    const expectedPercentages = {all: '70%', sedan: '75%', suv: '63%', 'people-movers': '75%'};
    const expectedTitles = {all: 'All Vehicles', sedan: 'Sedan', suv: 'SUV', 'people-movers': 'People Movers'};
    const expectedAllocations = {
      'Unit A': {all: [24, 7, 3, 34, 71], sedan: [9, 2, 1, 12, 75], suv: [9, 3, 2, 14, 64], 'people-movers': [6, 2, 0, 8, 75]},
      'Unit B': {all: [22, 6, 4, 32, 69], sedan: [8, 2, 1, 11, 73], suv: [8, 3, 2, 13, 62], 'people-movers': [6, 1, 1, 8, 75]},
      'Unit C': {all: [21, 6, 2, 29, 72], sedan: [7, 2, 0, 9, 78], suv: [7, 3, 1, 11, 64], 'people-movers': [7, 1, 1, 9, 78]},
      'Unit D': {all: [17, 5, 3, 25, 68], sedan: [6, 1, 1, 8, 75], suv: [6, 2, 2, 10, 60], 'people-movers': [5, 2, 0, 7, 71]},
      All: {all: [84, 24, 12, 120, 70], sedan: [30, 7, 3, 40, 75], suv: [30, 11, 7, 48, 63], 'people-movers': [24, 6, 2, 32, 75]},
    };
    const report = (status, detail) => {
      document.body.dataset.result = status.toLowerCase();
      document.getElementById('result').textContent = `${status}: ${detail}`;
    };

    document.getElementById('prototype').addEventListener('load', async event => {
      const frame = event.currentTarget;
      try {
        await delay(100);
        const doc = frame.contentDocument;
        const api = frame.contentWindow.prototypeApi;
        if (!api) throw new Error('prototype API was not exposed');
        if (api.vehicleRecords.length !== 120) throw new Error(`record count was ${api.vehicleRecords.length}`);
        if (new Set(api.vehicleRecords.map(record => record.id)).size !== 120) throw new Error('record IDs were not unique');
        if (new Set(api.vehicleRecords.map(record => record.plate)).size !== 120) throw new Error('plate numbers were not unique');
        for (const [unit, screens] of Object.entries(expectedAllocations)) {
          for (const [screen, expected] of Object.entries(screens)) {
            const aggregate = api.aggregateFor(unit, screen);
            const actual = [aggregate.available, aggregate.mission, aggregate.unavailable, aggregate.total, aggregate.percent];
            if (JSON.stringify(actual) !== JSON.stringify(expected)) {
              throw new Error(`${unit}/${screen} aggregate was ${JSON.stringify(actual)}`);
            }
            if (api.recordsFor(unit, screen).length !== expected[3]) {
              throw new Error(`${unit}/${screen} record total did not match aggregate`);
            }
          }
        }
        let retained = api.transition({screen: 'dashboard', theme: 'light', unit: 'All', date: '2026-10-22', activeRecordId: null}, {type: 'set-unit', unit: 'Unit C'});
        retained = api.transition(retained, {type: 'set-date', date: '2026-12-31'});
        retained = api.transition(retained, {type: 'navigate', screen: 'suv'});
        retained = api.transition(retained, {type: 'toggle-theme'});
        if (retained.unit !== 'Unit C' || retained.date !== '2026-12-31' || retained.screen !== 'suv' || retained.theme !== 'dark') {
          throw new Error(`unit/date state was not retained: ${JSON.stringify(retained)}`);
        }
        const unitSelect = doc.getElementById('unit-filter');
        const dateInput = doc.getElementById('dashboard-date');
        if (!unitSelect || JSON.stringify([...unitSelect.options].map(option => option.value)) !== JSON.stringify(['All', 'Unit A', 'Unit B', 'Unit C', 'Unit D'])) {
          throw new Error('dashboard Unit options were missing or incorrect');
        }
        if (unitSelect.value !== 'All') throw new Error(`default Unit was ${unitSelect.value}`);
        if (!dateInput || dateInput.type !== 'date' || dateInput.value !== '2026-10-22') throw new Error('dashboard date picker default was incorrect');
        const dashboardPercentages = [...doc.querySelectorAll('.category-numbers > div:first-child')].map(node => node.textContent.trim());
        const expectedDashboard = Object.values(expectedPercentages);
        if (JSON.stringify(dashboardPercentages) !== JSON.stringify(expectedDashboard)) {
          throw new Error(`dashboard percentages were ${JSON.stringify(dashboardPercentages)}`);
        }
        const backgrounds = [...doc.querySelectorAll('.category-card')].map(node => getComputedStyle(node).backgroundColor);
        if (backgrounds.some(background => background !== 'rgb(255, 255, 255)')) {
          throw new Error(`Light Mode card backgrounds were ${JSON.stringify(backgrounds)}`);
        }
        unitSelect.value = 'Unit C';
        unitSelect.dispatchEvent(new Event('change', {bubbles: true}));
        await delay(100);
        if (doc.querySelector('.category-all .service-percent').textContent.trim() !== '72%' || !doc.querySelector('.category-all').textContent.includes('21 / 29')) {
          throw new Error('Unit C dashboard aggregate did not render');
        }
        doc.getElementById('dashboard-date').value = '2026-12-31';
        doc.getElementById('dashboard-date').dispatchEvent(new Event('change', {bubbles: true}));
        await delay(100);
        doc.querySelector('.category-suv .round-arrow').click();
        await delay(100);
        const detailUnit = doc.getElementById('detail-unit');
        if (!detailUnit || !detailUnit.disabled || detailUnit.value !== 'Unit C') throw new Error('detail Unit was not retained and disabled');
        if (!doc.querySelector('.date[data-date="2026-12-31"]')) throw new Error('selected date was not retained on detail page');
        if (doc.querySelector('.summary-percent').textContent.trim() !== '64%' || !doc.querySelector('.summary-main').textContent.includes('7 / 11')) {
          throw new Error('Unit C SUV detail aggregate did not match dashboard data');
        }
        if ([...doc.querySelectorAll('th')].some(cell => cell.textContent.trim() === 'Actions')) throw new Error('Actions column remained');
        if (doc.querySelectorAll('tbody tr').length !== 10) throw new Error('selected-unit first page did not contain ten records');
        const beforeDialog = JSON.stringify(api.vehicleRecords);
        doc.querySelector('tbody tr').dispatchEvent(new MouseEvent('dblclick', {bubbles: true}));
        await delay(100);
        const dialog = doc.querySelector('dialog[open]');
        if (!dialog) throw new Error('row double-click did not open the dialog');
        const labels = [...dialog.querySelectorAll('label')].map(label => label.childNodes[0].textContent.trim().replace(/:$/, ''));
        const expectedLabels = ['Status', 'Discovered Date', 'Location', 'Deployed', 'Reason for Non-Serviceability'];
        if (JSON.stringify(labels) !== JSON.stringify(expectedLabels)) throw new Error(`dialog fields were ${JSON.stringify(labels)}`);
        if (dialog.querySelector('textarea')?.rows !== 5) throw new Error('reason textarea did not have five rows');
        const optionSets = [...dialog.querySelectorAll('select')].map(select => [...select.options].map(option => option.value));
        if (JSON.stringify(optionSets) !== JSON.stringify([['Serviceable', 'Non-Serviceable'], ['Inside Country', 'Outside Country'], ['Yes', 'No']])) {
          throw new Error(`dialog options were ${JSON.stringify(optionSets)}`);
        }
        dialog.querySelector('textarea').value = 'temporary only';
        dialog.close();
        await delay(100);
        if (JSON.stringify(api.vehicleRecords) !== beforeDialog) throw new Error('dialog changed vehicle records');
        frame.contentWindow.location.hash = 'dashboard';
        await delay(100);
        const resetUnit = doc.getElementById('unit-filter');
        resetUnit.value = 'All';
        resetUnit.dispatchEvent(new Event('change', {bubbles: true}));
        await delay(100);
        if (doc.querySelector('.category-all .service-percent').textContent.trim() !== '70%' || !doc.querySelector('.category-all').textContent.includes('84 / 120')) {
          throw new Error('All did not restore original dashboard values');
        }
        for (const screen of Object.keys(expectedPercentages)) {
          frame.contentWindow.location.hash = 'dashboard';
          await delay(100);
          const card = doc.querySelector(`.category-${screen}`);
          card.click();
          await delay(100);
          if (frame.contentWindow.location.hash !== '#dashboard') throw new Error(`${screen} card background navigated`);
          for (const selector of ['h2', '.service-percent', '.vehicle-art']) {
            card.querySelector(selector).click();
            await delay(100);
            if (frame.contentWindow.location.hash !== '#dashboard') throw new Error(`${screen} ${selector} navigated`);
          }
          card.querySelector('.round-arrow').click();
          await delay(100);
          if (frame.contentWindow.location.hash !== `#${screen}` || doc.querySelector('h1').textContent !== expectedTitles[screen]) {
            throw new Error(`${screen} arrow did not open its detail page`);
          }
        }
        for (const [screen, percentage] of Object.entries(expectedPercentages)) {
          frame.contentWindow.location.hash = screen;
          await delay(100);
          const rendered = doc.querySelector('.summary-percent').textContent.trim();
          if (rendered !== percentage) throw new Error(`${screen} detail percentage was ${JSON.stringify(rendered)}`);
        }
        report('PASS', '120 fixed records; reconciled units; retained Unit/date; arrow-only navigation; Actions removed; non-saving row dialog');
      } catch (error) {
        report('FAIL', error.message);
      }
    });
  </script>
</body>
